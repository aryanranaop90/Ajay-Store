,<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- NO-REFERRER: Hotlink blocking aur 403 Forbidden errors ko bypass karta hai -->
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AJAY STORE — Feel Comfort For Everyone</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Firebase v10 Compat (App & Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #0a0f1d;
      --accent: #d4a373;
      --accent-soft: #faedcd;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --whatsapp: #25d366;
      --danger: #ef4444;
      --success: #10b981;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sheet: 0 -10px 40px rgba(0, 0, 0, 0.18);
      --bottom-nav-height: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(var(--bottom-nav-height) + 24px);
    }

    .app-viewport {
      max-width: 520px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.08);
    }
    @media (min-width: 1024px) {
      .app-viewport { max-width: 1100px; }
    }

    /* TOP NOTICE */
    .app-top-notice {
      background: var(--primary);
      color: #cbd5e1;
      font-size: 0.72rem;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    /* HEADER */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 800;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--primary);
      line-height: 1.1;
      text-transform: uppercase;
    }
    .brand-title span { color: var(--accent); }
    .brand-subtitle {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .icon-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
    }
    .count-pill {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      min-width: 17px;
      height: 17px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--surface);
    }

    /* SEARCH BAR */
    .search-container {
      margin-top: 10px;
      position: relative;
    }
    .search-input-field {
      width: 100%;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      padding: 10px 38px 10px 38px;
      font-size: 0.86rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-input-field:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.15);
    }
    .search-left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    /* HERO BANNER CARD */
    .hero-container { margin: 12px 14px; }
    .hero-banner-card {
      background: linear-gradient(135deg, #070b15 0%, #18223c 60%, #0a0f1d 100%);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }
    .hero-banner-card::after {
      content: '1993';
      position: absolute;
      right: -8px;
      bottom: -15px;
      font-family: 'Syne', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      color: rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .hero-banner-card h2 {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .hero-banner-card p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 12px;
      max-width: 320px;
    }
    .coupon-chip {
      background: rgba(212, 163, 115, 0.15);
      border: 1px dashed var(--accent);
      color: var(--accent-soft);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-block;
    }

    /* CATEGORIES BAR */
    .categories-bar {
      padding: 10px 14px;
      background: var(--surface);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(10, 15, 29, 0.15);
    }

    /* FEED CONTROLS */
    .feed-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px 16px;
    }
    .feed-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.3px;
    }
    .item-count-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 14px 20px 14px;
    }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 1024px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.2s;
    }
    .product-card:active { transform: scale(0.98); }

    /* IMAGE CONTAINER (ZERO DUMMIES — SHOWS REAL IMAGE OR CLEAN ICON) */
    .product-media-wrap {
      position: relative;
      aspect-ratio: 3 / 4;
      background: #f1f5f9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #f8fafc;
    }
    .product-media-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 10px;
    }
    .product-media-placeholder i {
      font-size: 2.2rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .discount-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #000;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      z-index: 2;
    }
    .sold-out-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--danger);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      z-index: 2;
    }
    .heart-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(4px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .heart-btn.active { color: var(--danger); background: #fee2e2; }

    .product-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product-cat {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .product-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      height: 34px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 6px;
    }
    .product-price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
    }
    .price-main {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }
    .price-old {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-decoration: line-through;
    }
    .add-bag-btn {
      margin-top: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      width: 100%;
      padding: 9px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .add-bag-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    .add-bag-btn:active { background: var(--accent); color: #000; }

    /* BOTTOM SHEETS */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .sheet-scrim.active { opacity: 1; visibility: visible; }
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(105%);
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      z-index: 1001;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 1024px) {
      .bottom-sheet { max-width: 600px; }
    }
    .bottom-sheet.open { transform: translateX(-50%) translateY(0); }
    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #cbd5e1;
      border-radius: var(--radius-full);
      margin: 10px auto 4px auto;
    }
    .sheet-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sheet-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .sheet-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .size-chips-grid {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }
    .size-chip {
      flex: 1;
      text-align: center;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 0;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .size-chip.selected {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .cart-row {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .cart-row-details { flex: 1; }
    .qty-box {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
    }
    .qty-box button {
      border: none;
      background: none;
      padding: 4px 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }
    .qty-box span {
      padding: 4px 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      outline: none;
    }

    .pay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pay-opt {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pay-opt.active {
      border-color: var(--primary);
      background: #f1f5f9;
    }
    .upi-qr-box {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      background: var(--surface-subtle);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
    }
    .upi-qr-box.show { display: flex; }
    .upi-qr-box img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      background: #fff;
      padding: 6px;
      border-radius: var(--radius-sm);
    }

    .btn-cta {
      width: 100%;
      background: var(--whatsapp);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: var(--bottom-nav-height);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 950;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    @media (min-width: 1024px) {
      .bottom-nav { max-width: 1100px; }
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      position: relative;
      width: 33.3%;
      padding: 6px 0;
    }
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-item i { font-size: 1.15rem; }
    .bottom-nav-item span { font-size: 0.65rem; font-weight: 700; }
    .nav-badge {
      position: absolute;
      top: 2px;
      right: 28%;
      background: var(--danger);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      border-radius: var(--radius-full);
      padding: 1px 5px;
    }

    .app-toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: var(--primary);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: var(--radius-full);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .app-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- TOP STATUS -->
    <div class="app-top-notice">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-badge"><span class="status-dot"></span> OPEN</span>
        <span id="topNoticeAddress">Lohani Gali, Station Road</span>
      </div>
      <span id="topNoticeHours">10:00 AM – 8:30 PM</span>
    </div>

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-main-row">
        <div>
          <div class="brand-title">AJAY STORE<span>.</span></div>
          <div class="brand-subtitle">FEEL COMFORT FOR EVERYONE • EST. 1993</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="icon-circle-btn" onclick="openWishlistSheet()">
            <i class="fa-solid fa-heart"></i>
            <span class="count-pill" id="wishlistBadge">0</span>
          </button>
        </div>
      </div>

      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-left-icon"></i>
        <input type="text" id="searchInput" class="search-input-field" placeholder="Search catalog..." onkeyup="renderProducts()" />
      </div>
    </header>

    <!-- HERO BANNER -->
    <div class="hero-container">
      <div class="hero-banner-card">
        <span style="font-size:0.68rem; font-weight:800; color:var(--accent); letter-spacing:1px;">OFFICIAL STORE PORTAL</span>
        <h2 id="heroTitle">Welcome to AJAY STORE</h2>
        <p id="heroSubtitle">Premium Garments, Daily Wear & Complete Hosiery collection in Jhumari Telaiya.</p>
        <div class="coupon-chip" onclick="applyCouponDirect(livePromoCode)">
          CODE: <strong id="heroPromoBadge">WELCOME50</strong>
        </div>
      </div>
    </div>

    <!-- CATEGORIES -->
    <div class="categories-bar" id="categoriesBar">
      <button class="cat-btn active" onclick="selectCategory('All', this)">All Items</button>
    </div>

    <!-- CATALOG TITLE -->
    <div class="feed-contr
